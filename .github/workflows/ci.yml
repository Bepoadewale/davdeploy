name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  docs-conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/check_doc_conventions.py
        env:
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      - run: python scripts/check_actions_configuration.py

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: make install
      - run: .venv/bin/python -m pip install pip-audit
      - run: make lint && make test && .venv/bin/pip-audit
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan repository for secrets
        uses: docker://zricethezav/gitleaks:v8.28.0
        with:
          args: detect --source . --no-banner --redact --exit-code 1
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with: { version: '1.0.0' }
      - run: opa test platform/opa
  cloud-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/setup-kubectl@v4
      - run: make terraform-validate && make kubernetes-render
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: anchore/sbom-action@v0
        with: { path: ., output-file: sbom.spdx.json }
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - run: docker build -f apps/api/Dockerfile .
      - name: Build Lambda release package
        run: bash scripts/build_lambda_packages.sh && unzip -t dist/lambda/davdeploy-control-plane.zip
  local-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: make bootstrap-local
      - run: >-
          make smoke && make api-contract && make demo-simple && make demo-complex
          && make demo-degraded && make demo-day2 && make demo && make demo-failure
          && make demo-readiness-failure && make customer-plan-e2e
          && make seed-demo-data
          && docker compose restart api && make smoke && make customer-plan-persistence
          && sleep 10 && make trace-check && make verify
      - run: >-
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
          | DAVDEPLOY_TOKEN=fixture-token .venv/bin/davdeploy-mcp
      - if: always()
        run: make clean-local
