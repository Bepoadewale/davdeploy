services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: davdeploy
      POSTGRES_USER: davdeploy
      POSTGRES_PASSWORD: davdeploy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U davdeploy -d davdeploy"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes: ["davdeploy-postgres:/var/lib/postgresql/data"]

  opa:
    image: openpolicyagent/opa:1.0.0-static
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies/davdeploy.rego"]
    ports:
      - "${DAVDEPLOY_OPA_HOST_PORT:-8181}:8181"
    volumes: ["./platform/opa:/policies:ro"]

  fixture-executor:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["uvicorn", "davdeploy.fixture_executor:app", "--host", "0.0.0.0", "--port", "8090"]
    ports: ["${DAVDEPLOY_EXECUTOR_HOST_PORT:-8090}:8090"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["uvicorn", "davdeploy.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      DAVDEPLOY_DATABASE_URL: postgresql+psycopg://davdeploy:davdeploy@postgres:5432/davdeploy
      DAVDEPLOY_OPA_URL: http://opa:8181/v1/data/davdeploy/decision
      DAVDEPLOY_EXECUTOR_URL: http://fixture-executor:8090
      DAVDEPLOY_LOCAL_SIGNING_KEY: local-compose-fixture-signing-key-at-least-32-bytes
      DAVDEPLOY_GITHUB_APP_READ_ONLY: ${DAVDEPLOY_GITHUB_APP_READ_ONLY:-false}
      DAVDEPLOY_GITHUB_APP_ID: ${DAVDEPLOY_GITHUB_APP_ID:-}
      DAVDEPLOY_GITHUB_APP_INSTALLATION_ID: ${DAVDEPLOY_GITHUB_APP_INSTALLATION_ID:-}
      DAVDEPLOY_GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
      DAVDEPLOY_CONTROL_PLANE_ROLE_ARN: ${DAVDEPLOY_CONTROL_PLANE_ROLE_ARN:-}
      DAVDEPLOY_AWS_CONNECTION_TEMPLATE_URL: ${DAVDEPLOY_AWS_CONNECTION_TEMPLATE_URL:-}
      DAVDEPLOY_AWS_LIVE_DISCOVERY_ENABLED: ${DAVDEPLOY_AWS_LIVE_DISCOVERY_ENABLED:-false}
      DAVDEPLOY_ALLOWED_FRONTEND_ORIGINS: ${DAVDEPLOY_ALLOWED_FRONTEND_ORIGINS:-http://localhost:5173}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres: {condition: service_healthy}
      opa: {condition: service_started}
      fixture-executor: {condition: service_started}
    ports: ["${DAVDEPLOY_API_HOST_PORT:-8080}:8080"]
    volumes:
      - "${DAVDEPLOY_GITHUB_APP_KEY_HOST_PATH:-/dev/null}:/run/secrets/github-app.pem:ro"

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "davdeploy.worker"]
    environment:
      DAVDEPLOY_DATABASE_URL: postgresql+psycopg://davdeploy:davdeploy@postgres:5432/davdeploy
      DAVDEPLOY_OPA_URL: http://opa:8181/v1/data/davdeploy/decision
      DAVDEPLOY_EXECUTOR_URL: http://fixture-executor:8090
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres: {condition: service_healthy}
      opa: {condition: service_started}
      fixture-executor: {condition: service_started}

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - "./platform/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./platform/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro"
    ports: ["${DAVDEPLOY_PROMETHEUS_HOST_PORT:-9090}:9090"]
    depends_on: [api]

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes: ["./platform/tempo/tempo.yml:/etc/tempo.yml:ro"]
    ports: ["${DAVDEPLOY_TEMPO_HOST_PORT:-3200}:3200"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes: ["./platform/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro"]
    depends_on: [tempo]

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["${DAVDEPLOY_GRAFANA_HOST_PORT:-3000}:3000"]
    volumes:
      - "./platform/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./dashboards:/var/lib/grafana/dashboards:ro"
    depends_on: [prometheus, tempo]

volumes:
  davdeploy-postgres:
