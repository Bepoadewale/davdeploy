AWSTemplateFormatVersion: "2010-09-09"
Description: davdeploy read-only AWS discovery connection. Creates no workload or execution resources.
Parameters:
  davdeployDiscoveryBrokerRoleArn:
    Type: String
  ExternalId:
    Type: String
    NoEcho: true
  ConnectionId:
    Type: String
    AllowedPattern: "[A-Za-z0-9-]{8,40}"
Resources:
  DiscoveryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "davdeployDiscovery-${ConnectionId}"
      Description: davdeploy read-only infrastructure and cost discovery. No workload mutation or data access.
      MaxSessionDuration: 3600
      Tags:
        - Key: ManagedBy
          Value: davdeploy
        - Key: ConnectionId
          Value: !Ref ConnectionId
        - Key: Access
          Value: discovery-read-only
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref davdeployDiscoveryBrokerRoleArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: davdeployDiscoveryMetadataOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - apprunner:DescribeService
                  - apprunner:ListServices
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - ce:GetDimensionValues
                  - cloudwatch:DescribeAlarms
                  - ec2:Describe*
                  - ecr:DescribeRepositories
                  - ecr:ListImages
                  - ecs:DescribeClusters
                  - ecs:DescribeServices
                  - ecs:ListClusters
                  - ecs:ListServices
                  - eks:DescribeCluster
                  - eks:ListClusters
                  - elasticache:Describe*
                  - kms:DescribeKey
                  - kms:ListAliases
                  - pricing:GetProducts
                  - lambda:GetFunctionConfiguration
                  - lambda:ListFunctions
                  - rds:Describe*
                  - s3:GetBucketEncryption
                  - s3:GetBucketLocation
                  - s3:GetBucketTagging
                  - s3:ListAllMyBuckets
                  - secretsmanager:DescribeSecret
                  - secretsmanager:ListSecrets
                  - tag:GetResources
                Resource: "*"
Outputs:
  DiscoveryRoleArn:
    Description: Read-only role used by davdeploy after connection verification.
    Value: !GetAtt DiscoveryRole.Arn
  ConnectionId:
    Value: !Ref ConnectionId
