name: Terraform apply

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_SAVED_SERVERLESS_PLAN
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: terraform-apply-serverless-control-plane
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'APPLY_SAVED_SERVERLESS_PLAN'
    environment: terraform-apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.EXPECTED_AWS_ACCOUNT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_LOCK_TABLE: ${{ vars.TF_STATE_LOCK_TABLE }}
      TF_PLAN_BUCKET: ${{ vars.TF_PLAN_BUCKET }}

    steps:
      - name: Verify the selected plan run
        id: plan_run
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/terraform-plan.yml/runs?branch=main&event=workflow_dispatch&per_page=100" >plan-runs.json
          jq --arg sha "${GITHUB_SHA}" \
            '[.workflow_runs[] | select(.head_sha == $sha)] | first' \
            plan-runs.json >plan-run.json
          plan_run_id="$(jq -r '.id // empty' plan-run.json)"
          plan_run_attempt="$(jq -r '.run_attempt // empty' plan-run.json)"
          test -n "${plan_run_id}" || { echo "No manual Terraform plan exists for the current main commit" >&2; exit 1; }
          [[ "${plan_run_id}" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid resolved plan run ID" >&2; exit 1; }
          [[ "${plan_run_attempt}" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid resolved plan run attempt" >&2; exit 1; }
          test "$(jq -r '.name' plan-run.json)" = "Terraform plan" || { echo "Run is not a Terraform plan workflow" >&2; exit 1; }
          test "$(jq -r '.path' plan-run.json)" = ".github/workflows/terraform-plan.yml" || { echo "Unexpected plan workflow path" >&2; exit 1; }
          test "$(jq -r '.event' plan-run.json)" = "workflow_dispatch" || { echo "Plan was not manually dispatched" >&2; exit 1; }
          test "$(jq -r '.conclusion' plan-run.json)" = "success" || { echo "Plan run did not succeed" >&2; exit 1; }
          test "$(jq -r '.head_branch' plan-run.json)" = "main" || { echo "Plan did not run from main" >&2; exit 1; }
          plan_sha="$(jq -r '.head_sha' plan-run.json)"
          test "${plan_sha}" = "${GITHUB_SHA}" || { echo "Plan commit is not the current main commit" >&2; exit 1; }
          echo "run_id=${plan_run_id}" >>"${GITHUB_OUTPUT}"
          echo "run_attempt=${plan_run_attempt}" >>"${GITHUB_OUTPUT}"
          echo "sha=${plan_sha}" >>"${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan_run.outputs.sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.7'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate required configuration and AWS identity
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION EXPECTED_AWS_ACCOUNT_ID TF_STATE_BUCKET TF_STATE_LOCK_TABLE TF_PLAN_BUCKET; do
            test -n "${!name:-}" || { echo "Missing required GitHub environment variable: ${name}" >&2; exit 1; }
          done
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "${actual_account_id}" = "${EXPECTED_AWS_ACCOUNT_ID}" || { echo "AWS account mismatch" >&2; exit 1; }

      - name: Download and verify the saved plan
        working-directory: infrastructure/terraform/serverless-control-plane
        shell: bash
        run: |
          set -euo pipefail
          plan_key="plans/serverless-control-plane/${{ steps.plan_run.outputs.sha }}/${{ steps.plan_run.outputs.run_id }}/${{ steps.plan_run.outputs.run_attempt }}"
          aws s3 cp "s3://${TF_PLAN_BUCKET}/${plan_key}/tfplan" tfplan --only-show-errors
          aws s3 cp "s3://${TF_PLAN_BUCKET}/${plan_key}/manifest.json" tfplan-manifest.json --only-show-errors
          test "$(jq -r '.commit' tfplan-manifest.json)" = "${{ steps.plan_run.outputs.sha }}" || { echo "Plan commit mismatch" >&2; exit 1; }
          test "$(jq -r '.run_id' tfplan-manifest.json)" = "${{ steps.plan_run.outputs.run_id }}" || { echo "Plan run mismatch" >&2; exit 1; }
          test "$(jq -r '.run_attempt' tfplan-manifest.json)" = "${{ steps.plan_run.outputs.run_attempt }}" || { echo "Plan run attempt mismatch" >&2; exit 1; }
          test "$(jq -r '.manifest_version' tfplan-manifest.json)" = "2" || { echo "Unsupported saved-plan manifest" >&2; exit 1; }
          test "$(jq -r '.deployment' tfplan-manifest.json)" = "production" || { echo "Saved plan is not for the production control plane" >&2; exit 1; }
          echo "$(jq -r '.sha256' tfplan-manifest.json)  tfplan" | sha256sum --check --strict

      - name: Initialize the recorded state and apply only the saved plan
        working-directory: infrastructure/terraform/serverless-control-plane
        shell: bash
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=serverless-control-plane/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}" \
            -backend-config="encrypt=true"
          terraform apply -input=false tfplan

      - name: Refresh the short-lived apply session
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          unset-current-credentials: true

      - name: Run and verify database migrations
        working-directory: infrastructure/terraform/serverless-control-plane
        shell: bash
        run: |
          set -euo pipefail
          migration_function="$(terraform output -raw migration_function_name)"
          test -n "${migration_function}" || { echo "Terraform returned no migration function" >&2; exit 1; }
          for attempt in 1 2 3 4 5 6; do
            invoke_result="$(aws lambda invoke \
              --function-name "${migration_function}" \
              --cli-binary-format raw-in-base64-out \
              --payload '{}' \
              migration-response.json)"
            if test -z "$(jq -r '.FunctionError // empty' <<<"${invoke_result}")" \
              && jq -e '.status == "migrations-complete"' migration-response.json >/dev/null; then
              echo "Database migrations completed successfully"
              exit 0
            fi

            if [ "${attempt}" -eq 6 ]; then
              echo "Migration Lambda did not confirm completion after bounded retry" >&2
              jq . migration-response.json >&2
              exit 1
            fi

            echo "Migration attempt ${attempt} did not complete; waiting for a possible Aurora resume" >&2
            sleep 10
          done

      - name: Record result
        if: always()
        shell: bash
        run: |
          {
            echo '## Terraform apply'
            echo
            echo "Saved plan run ID: \`${{ steps.plan_run.outputs.run_id }}\`"
            echo "Saved plan run attempt: \`${{ steps.plan_run.outputs.run_attempt }}\`"
            echo "Commit: \`${{ steps.plan_run.outputs.sha }}\`"
            echo "Job result: \`${{ job.status }}\`"
          } >>"${GITHUB_STEP_SUMMARY}"
